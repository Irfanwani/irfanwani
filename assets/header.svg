<svg width="1600" height="360" viewBox="0 0 1600 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Irfan Wani - SDE and Integration Manager">
  <defs>
    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C6FFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#7C6FFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4AA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00D4AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7C6FFF"/>
      <stop offset="0.5" stop-color="#00D4AA"/>
      <stop offset="1" stop-color="#00D9FF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1200 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shoot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="360" rx="16" fill="#0D1117"/>

  <!-- drifting nebulas -->
  <circle cx="260" cy="90" r="240" fill="url(#nebulaPurple)">
    <animate attributeName="cx" values="260;430;260" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1350" cy="280" r="260" fill="url(#nebulaTeal)">
    <animate attributeName="cx" values="1350;1180;1350" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling stars -->
  <circle cx="80" cy="50" r="1.6" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="2.8s" begin="-0.4s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="140" r="1.2" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="60" r="2" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;1;0.1" dur="4.1s" begin="-2.1s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="230" r="1.3" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.1s" begin="-0.8s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="90" r="1.7" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="2.5s" begin="-1.7s" repeatCount="indefinite"/></circle>
  <circle cx="640" cy="300" r="1.2" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.8s" begin="-2.6s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="45" r="1.5" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="-0.2s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="310" r="1.8" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;1;0.15" dur="3.6s" begin="-1.4s" repeatCount="indefinite"/></circle>
  <circle cx="960" cy="70" r="1.3" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.6s" begin="-2.2s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="250" r="1.6" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;0.95;0.1" dur="4.3s" begin="-0.6s" repeatCount="indefinite"/></circle>
  <circle cx="1180" cy="55" r="1.4" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.85;0.2" dur="3.2s" begin="-1.9s" repeatCount="indefinite"/></circle>
  <circle cx="1290" cy="150" r="2" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;1;0.15" dur="2.7s" begin="-0.9s" repeatCount="indefinite"/></circle>
  <circle cx="1400" cy="70" r="1.2" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3.9s" begin="-2.8s" repeatCount="indefinite"/></circle>
  <circle cx="1520" cy="180" r="1.7" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.3s" begin="-1.1s" repeatCount="indefinite"/></circle>
  <circle cx="1560" cy="320" r="1.4" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="300" r="1.5" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.7s" begin="-0.3s" repeatCount="indefinite"/></circle>
  <circle cx="240" cy="330" r="1.1" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="4.5s" begin="-2.4s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="320" r="1.6" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.9s" begin="-1.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="330" r="1.2" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" begin="-0.7s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="40" r="1.6" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="3.0s" begin="-2.0s" repeatCount="indefinite"/></circle>
  <circle cx="1120" cy="330" r="1.3" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4.2s" begin="-1.3s" repeatCount="indefinite"/></circle>
  <circle cx="1240" cy="40" r="1.5" fill="#E6EDF3"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.6s" begin="-0.5s" repeatCount="indefinite"/></circle>
  <circle cx="1460" cy="250" r="1.2" fill="#C9D1D9"><animate attributeName="opacity" values="0.2;0.75;0.2" dur="3.6s" begin="-2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1340" cy="330" r="1.6" fill="#E6EDF3"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" begin="-1.5s" repeatCount="indefinite"/></circle>

  <!-- shooting stars -->
  <g opacity="0">
    <line x1="180" y1="70" x2="265" y2="27" stroke="url(#shoot)" stroke-width="2.5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;540 230;540 230" keyTimes="0;0.12;1" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.05;0.12;1" dur="13s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <line x1="1160" y1="295" x2="1245" y2="252" stroke="url(#shoot)" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-430 -175;-430 -175" keyTimes="0;0.1;1" dur="17s" begin="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;0.04;0.1;1" dur="17s" begin="6s" repeatCount="indefinite"/>
  </g>

  <!-- title -->
  <text x="800" y="172" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" letter-spacing="8" fill="url(#flow)" filter="url(#softGlow)">IRFAN WANI</text>

  <!-- animated divider -->
  <rect x="540" y="208" width="520" height="2.5" rx="1.25" fill="url(#flow)" opacity="0.65"/>

  <!-- subtitle -->
  <text x="800" y="262" text-anchor="middle" font-family="Consolas,Menlo,'Courier New',monospace" font-size="27" letter-spacing="2" fill="#9BA4B4">SDE &amp; Integration Manager</text>
</svg>
